<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Galeria · Casamento Flavia e Lucas</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #1a1208;
      color: #f0e6d3;
      font-family: 'Georgia', serif;
      min-height: 100vh;
    }

    header {
      text-align: center;
      padding: 32px 16px 20px;
      border-bottom: 1px solid rgba(201,168,124,0.2);
    }

    header .flores { font-size: 22px; }

    header h1 {
      font-size: 20px;
      font-weight: normal;
      color: #c9a87c;
      letter-spacing: 1px;
      margin: 4px 0 2px;
    }

    header p { font-size: 11px; color: #9c7c5e; font-style: italic; }

    #contador { font-size: 10px; color: #7a6050; margin-top: 6px; }

    /* Barra de seleção */
    #barra-selecao {
      display: none;
      position: sticky;
      top: 0;
      z-index: 50;
      background: #2a1a08;
      border-bottom: 1px solid rgba(201,168,124,0.3);
      padding: 10px 16px;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    #barra-selecao.visivel { display: flex; }

    #barra-selecao span {
      font-size: 12px;
      color: #c9a87c;
    }

    .btn-zip {
      background: #c9a87c;
      color: #1a1208;
      border: none;
      padding: 7px 16px;
      border-radius: 20px;
      font-size: 11px;
      font-family: 'Georgia', serif;
      cursor: pointer;
      transition: background 0.2s;
      font-weight: bold;
    }

    .btn-zip:hover { background: #b8916a; }
    .btn-zip:disabled { background: #555; cursor: not-allowed; color: #888; }

    .btn-cancelar {
      background: none;
      border: none;
      color: #7a6050;
      font-size: 11px;
      cursor: pointer;
      font-family: 'Georgia', serif;
    }

    .btn-cancelar:hover { color: #c9a87c; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 3px;
      padding: 3px;
    }

    .grid-item {
      aspect-ratio: 1;
      overflow: hidden;
      cursor: pointer;
      background: #2a1f10;
      position: relative;
    }

    .grid-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.3s ease, opacity 0.4s;
      opacity: 0;
    }

    .grid-item img.loaded { opacity: 1; }
    .grid-item:hover img { transform: scale(1.05); }

    /* Checkbox de seleção */
    .grid-item .check {
      display: none;
      position: absolute;
      top: 6px;
      left: 6px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid white;
      background: rgba(0,0,0,0.4);
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: white;
      transition: all 0.15s;
    }

    .grid-item:hover .check,
    .modo-selecao .grid-item .check { display: flex; }

    .grid-item.selecionada .check {
      background: #c9a87c;
      border-color: #c9a87c;
    }

    .grid-item.selecionada::after {
      content: '';
      position: absolute;
      inset: 0;
      border: 3px solid #c9a87c;
      pointer-events: none;
    }

    #sentinel {
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #7a6050;
      font-size: 11px;
      font-style: italic;
    }

    /* Lightbox */
    #lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.92);
      z-index: 100;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }

    #lightbox.open { display: flex; }

    #lightbox img {
      max-width: 92vw;
      max-height: 88vh;
      object-fit: contain;
      border-radius: 2px;
    }

    #lightbox-close {
      position: absolute;
      top: 16px;
      right: 20px;
      font-size: 28px;
      color: #c9a87c;
      cursor: pointer;
      background: none;
      border: none;
      line-height: 1;
    }

    /* Botão selecionar esta no lightbox */
    #lightbox-selecionar {
      margin-top: 12px;
      background: none;
      border: 1px solid #c9a87c;
      color: #c9a87c;
      padding: 6px 18px;
      border-radius: 20px;
      font-size: 11px;
      font-family: 'Georgia', serif;
      cursor: pointer;
      letter-spacing: 1px;
      transition: all 0.2s;
    }

    #lightbox-selecionar:hover,
    #lightbox-selecionar.marcada {
      background: #c9a87c;
      color: #1a1208;
    }

    #lightbox-prev,
    #lightbox-next {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      font-size: 32px;
      color: #c9a87c;
      cursor: pointer;
      background: none;
      border: none;
      padding: 0 16px;
      line-height: 1;
      opacity: 0.7;
    }

    #lightbox-prev { left: 4px; }
    #lightbox-next { right: 4px; }
    #lightbox-prev:hover, #lightbox-next:hover { opacity: 1; }

    #vazio {
      text-align: center;
      padding: 60px 20px;
      color: #7a6050;
      font-style: italic;
      display: none;
    }

    /* Status download */
    #status-download {
      display: none;
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #2a1a08;
      border: 1px solid rgba(201,168,124,0.4);
      color: #c9a87c;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 12px;
      z-index: 200;
    }
  </style>
</head>
<body>

  <header>
    <div class="flores">🌸</div>
    <h1>Casamento Flavia e Lucas</h1>
    <p>Momentos guardados com carinho</p>
    <div id="contador"></div>
  </header>

  <div id="barra-selecao">
    <span id="txt-selecionadas">0 selecionadas</span>
    <div style="display:flex;gap:10px;align-items:center">
      <button class="btn-cancelar" onclick="cancelarSelecao()">Cancelar</button>
      <button class="btn-zip" id="btn-baixar" onclick="baixarZip()" disabled>↓ Baixar ZIP</button>
    </div>
  </div>

  <div class="grid" id="grid"></div>
  <div id="vazio">Nenhuma foto ainda ✨</div>
  <div id="sentinel">Carregando...</div>

  <div id="status-download">Preparando ZIP...</div>

  <!-- Lightbox -->
  <div id="lightbox">
    <button id="lightbox-close">✕</button>
    <button id="lightbox-prev">‹</button>
    <img id="lightbox-img" src="" alt=""/>
    <button id="lightbox-next">›</button>
    <button id="lightbox-selecionar" onclick="selecionarDoLightbox()">Selecionar esta foto</button>
  </div>

  <script>
    const grid        = document.getElementById('grid');
    const sentinel    = document.getElementById('sentinel');
    const contador    = document.getElementById('contador');
    const vazio       = document.getElementById('vazio');
    const lightbox    = document.getElementById('lightbox');
    const lbImg       = document.getElementById('lightbox-img');
    const lbSel       = document.getElementById('lightbox-selecionar');
    const barraSelecao = document.getElementById('barra-selecao');
    const txtSel      = document.getElementById('txt-selecionadas');
    const btnBaixar   = document.getElementById('btn-baixar');
    const statusDl    = document.getElementById('status-download');

    let nextCursor  = null;
    let loading     = false;
    let ended       = false;
    let allFotos    = [];
    let currentIdx  = 0;
    let selecionadas = new Set();
    let modoSelecao = false;

    const imgObserver = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        if (e.isIntersecting) {
          const img = e.target;
          img.src = img.dataset.src;
          img.onload = () => img.classList.add('loaded');
          imgObserver.unobserve(img);
        }
      });
    }, { rootMargin: '200px' });

    const scrollObserver = new IntersectionObserver((entries) => {
      if (entries[0].isIntersecting && !loading && !ended) carregarMais();
    }, { rootMargin: '300px' });

    scrollObserver.observe(sentinel);

    async function carregarMais() {
      loading = true;
      sentinel.textContent = 'Carregando...';

      const url = nextCursor ? `/fotos?cursor=${encodeURIComponent(nextCursor)}` : '/fotos';

      try {
        const res  = await fetch(url);
        const data = await res.json();

        if (data.fotos.length === 0 && allFotos.length === 0) {
          vazio.style.display = 'block';
          sentinel.textContent = '';
          return;
        }

        data.fotos.forEach((foto) => {
          const idx = allFotos.length;
          allFotos.push(foto);

          const div = document.createElement('div');
          div.className = 'grid-item';
          div.dataset.idx = idx;

          const check = document.createElement('div');
          check.className = 'check';
          check.textContent = '✓';

          const img = document.createElement('img');
          img.dataset.src = foto.thumb;
          img.alt = `Foto ${idx + 1}`;
          imgObserver.observe(img);

          div.addEventListener('click', () => {
            if (modoSelecao) {
              toggleSelecao(idx, div);
            } else {
              abrirLightbox(idx);
            }
          });

          div.addEventListener('long-press', () => ativarModoSelecao(idx, div));

          // Long press pra mobile
          let pressTimer;
          div.addEventListener('touchstart', () => {
            pressTimer = setTimeout(() => ativarModoSelecao(idx, div), 500);
          });
          div.addEventListener('touchend', () => clearTimeout(pressTimer));
          div.addEventListener('touchmove', () => clearTimeout(pressTimer));

          div.appendChild(check);
          div.appendChild(img);
          grid.appendChild(div);
        });

        nextCursor = data.next_cursor || null;
        if (!nextCursor) {
          ended = true;
          sentinel.textContent = allFotos.length > 0 ? `✨ ${allFotos.length} fotos` : '';
        } else {
          sentinel.textContent = '';
        }

        contador.textContent = `${allFotos.length} foto(s)${!ended ? '+' : ''}`;

      } catch {
        sentinel.textContent = 'Erro ao carregar. Recarregue a página.';
      } finally {
        loading = false;
      }
    }

    function ativarModoSelecao(idx, div) {
      modoSelecao = true;
      grid.classList.add('modo-selecao');
      toggleSelecao(idx, div);
    }

    function toggleSelecao(idx, div) {
      if (selecionadas.has(idx)) {
        selecionadas.delete(idx);
        div.classList.remove('selecionada');
      } else {
        selecionadas.add(idx);
        div.classList.add('selecionada');
      }
      atualizarBarra();
    }

    function atualizarBarra() {
      const n = selecionadas.size;
      if (n > 0) {
        modoSelecao = true;
        grid.classList.add('modo-selecao');
        barraSelecao.classList.add('visivel');
        txtSel.textContent = `${n} selecionada${n > 1 ? 's' : ''}`;
        btnBaixar.disabled = false;
      } else {
        barraSelecao.classList.remove('visivel');
        btnBaixar.disabled = true;
        if (modoSelecao) cancelarSelecao();
      }
    }

    function cancelarSelecao() {
      selecionadas.clear();
      modoSelecao = false;
      grid.classList.remove('modo-selecao');
      barraSelecao.classList.remove('visivel');
      document.querySelectorAll('.grid-item.selecionada').forEach(el => el.classList.remove('selecionada'));
      lbSel.classList.remove('marcada');
      lbSel.textContent = 'Selecionar esta foto';
    }

    async function baixarZip() {
      if (selecionadas.size === 0) return;

      const urls = [...selecionadas].map(i => allFotos[i].url);

      btnBaixar.disabled = true;
      statusDl.style.display = 'block';
      statusDl.textContent = `Preparando ${urls.length} foto(s)...`;

      try {
        const res = await fetch('/download-zip', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ urls })
        });

        if (!res.ok) throw new Error();

        const blob = await res.blob();
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'fotos-casamento.zip';
        a.click();

        statusDl.textContent = '✓ Download iniciado!';
        setTimeout(() => { statusDl.style.display = 'none'; }, 3000);
        cancelarSelecao();

      } catch {
        statusDl.textContent = '✕ Erro ao gerar ZIP. Tente novamente.';
        setTimeout(() => { statusDl.style.display = 'none'; }, 3000);
      } finally {
        btnBaixar.disabled = false;
      }
    }

    // Lightbox
    function abrirLightbox(idx) {
      currentIdx = idx;
      lbImg.src = allFotos[idx].url;
      atualizarBotaoLightbox();
      lightbox.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function atualizarBotaoLightbox() {
      if (selecionadas.has(currentIdx)) {
        lbSel.classList.add('marcada');
        lbSel.textContent = '✓ Selecionada';
      } else {
        lbSel.classList.remove('marcada');
        lbSel.textContent = 'Selecionar esta foto';
      }
    }

    function selecionarDoLightbox() {
      const div = document.querySelector(`.grid-item[data-idx="${currentIdx}"]`);
      toggleSelecao(currentIdx, div);
      atualizarBotaoLightbox();
    }

    function fecharLightbox() {
      lightbox.classList.remove('open');
      document.body.style.overflow = '';
      lbImg.src = '';
    }

    function navLightbox(dir) {
      currentIdx = (currentIdx + dir + allFotos.length) % allFotos.length;
      lbImg.src = allFotos[currentIdx].url;
      atualizarBotaoLightbox();
    }

    document.getElementById('lightbox-close').onclick = fecharLightbox;
    document.getElementById('lightbox-prev').onclick  = () => navLightbox(-1);
    document.getElementById('lightbox-next').onclick  = () => navLightbox(1);
    lightbox.addEventListener('click', e => { if (e.target === lightbox) fecharLightbox(); });

    document.addEventListener('keydown', e => {
      if (!lightbox.classList.contains('open')) return;
      if (e.key === 'Escape')     fecharLightbox();
      if (e.key === 'ArrowLeft')  navLightbox(-1);
      if (e.key === 'ArrowRight') navLightbox(1);
    });
  </script>
</body>
</html>
