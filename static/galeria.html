<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Galeria · Casamento Flavia e Lucas</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #1a1208;
      color: #f0e6d3;
      font-family: 'Georgia', serif;
      min-height: 100vh;
    }

    header {
      text-align: center;
      padding: 32px 16px 20px;
      border-bottom: 1px solid rgba(201,168,124,0.2);
    }

    header .flores { font-size: 22px; }

    header h1 {
      font-size: 20px;
      font-weight: normal;
      color: #c9a87c;
      letter-spacing: 1px;
      margin: 4px 0 2px;
    }

    header p {
      font-size: 11px;
      color: #9c7c5e;
      font-style: italic;
    }

    #contador {
      font-size: 10px;
      color: #7a6050;
      margin-top: 6px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 3px;
      padding: 3px;
    }

    .grid-item {
      aspect-ratio: 1;
      overflow: hidden;
      cursor: pointer;
      background: #2a1f10;
    }

    .grid-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.3s ease, opacity 0.4s;
      opacity: 0;
    }

    .grid-item img.loaded { opacity: 1; }
    .grid-item:hover img { transform: scale(1.05); }

    #sentinel {
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #7a6050;
      font-size: 11px;
      font-style: italic;
    }

    /* Lightbox */
    #lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.92);
      z-index: 100;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }

    #lightbox.open { display: flex; }

    #lightbox img {
      max-width: 92vw;
      max-height: 85vh;
      object-fit: contain;
      border-radius: 2px;
    }

    #lightbox-close {
      position: absolute;
      top: 16px;
      right: 20px;
      font-size: 28px;
      color: #c9a87c;
      cursor: pointer;
      background: none;
      border: none;
      line-height: 1;
    }

    #lightbox-prev,
    #lightbox-next {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      font-size: 32px;
      color: #c9a87c;
      cursor: pointer;
      background: none;
      border: none;
      padding: 0 16px;
      line-height: 1;
      opacity: 0.7;
    }

    #lightbox-prev { left: 4px; }
    #lightbox-next { right: 4px; }
    #lightbox-prev:hover, #lightbox-next:hover { opacity: 1; }

    #lightbox-download {
      margin-top: 12px;
      font-size: 11px;
      color: #9c7c5e;
      text-decoration: none;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    #lightbox-download:hover { color: #c9a87c; }

    #vazio {
      text-align: center;
      padding: 60px 20px;
      color: #7a6050;
      font-style: italic;
      display: none;
    }
  </style>
</head>
<body>

  <header>
    <div class="flores">🌸</div>
    <h1>Casamento Flavia e Lucas</h1>
    <p>Momentos guardados com carinho</p>
    <div id="contador"></div>
  </header>

  <div class="grid" id="grid"></div>
  <div id="vazio">Nenhuma foto ainda ✨</div>
  <div id="sentinel">Carregando...</div>

  <!-- Lightbox -->
  <div id="lightbox">
    <button id="lightbox-close">✕</button>
    <button id="lightbox-prev">‹</button>
    <img id="lightbox-img" src="" alt=""/>
    <button id="lightbox-next">›</button>
    <a id="lightbox-download" href="" target="_blank">↓ abrir original</a>
  </div>

  <script>
    const grid      = document.getElementById('grid');
    const sentinel  = document.getElementById('sentinel');
    const contador  = document.getElementById('contador');
    const vazio     = document.getElementById('vazio');
    const lightbox  = document.getElementById('lightbox');
    const lbImg     = document.getElementById('lightbox-img');
    const lbDl      = document.getElementById('lightbox-download');

    let nextCursor  = null;
    let loading     = false;
    let ended       = false;
    let allFotos    = [];
    let currentIdx  = 0;

    // Lazy load com IntersectionObserver
    const imgObserver = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        if (e.isIntersecting) {
          const img = e.target;
          img.src = img.dataset.src;
          img.onload = () => img.classList.add('loaded');
          imgObserver.unobserve(img);
        }
      });
    }, { rootMargin: '200px' });

    // Infinite scroll
    const scrollObserver = new IntersectionObserver((entries) => {
      if (entries[0].isIntersecting && !loading && !ended) {
        carregarMais();
      }
    }, { rootMargin: '300px' });

    scrollObserver.observe(sentinel);

    async function carregarMais() {
      loading = true;
      sentinel.textContent = 'Carregando...';

      const url = nextCursor ? `/fotos?cursor=${encodeURIComponent(nextCursor)}` : '/fotos';

      try {
        const res  = await fetch(url);
        const data = await res.json();

        if (data.fotos.length === 0 && allFotos.length === 0) {
          vazio.style.display = 'block';
          sentinel.textContent = '';
          return;
        }

        data.fotos.forEach((foto, i) => {
          const idx  = allFotos.length;
          allFotos.push(foto);

          const div = document.createElement('div');
          div.className = 'grid-item';

          const img = document.createElement('img');
          img.dataset.src = foto.thumb;
          img.alt = `Foto ${idx + 1}`;
          img.addEventListener('click', () => abrirLightbox(idx));
          imgObserver.observe(img);

          div.appendChild(img);
          grid.appendChild(div);
        });

        nextCursor = data.next_cursor || null;
        if (!nextCursor) {
          ended = true;
          sentinel.textContent = allFotos.length > 0 ? `✨ ${allFotos.length} fotos` : '';
        } else {
          sentinel.textContent = '';
        }

        contador.textContent = `${allFotos.length} foto(s)${!ended ? '+' : ''}`;

      } catch {
        sentinel.textContent = 'Erro ao carregar. Recarregue a página.';
      } finally {
        loading = false;
      }
    }

    // Lightbox
    function abrirLightbox(idx) {
      currentIdx = idx;
      lbImg.src = allFotos[idx].url;
      lbDl.href = allFotos[idx].url;
      lightbox.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function fecharLightbox() {
      lightbox.classList.remove('open');
      document.body.style.overflow = '';
      lbImg.src = '';
    }

    function navLightbox(dir) {
      currentIdx = (currentIdx + dir + allFotos.length) % allFotos.length;
      lbImg.src = allFotos[currentIdx].url;
      lbDl.href = allFotos[currentIdx].url;
    }

    document.getElementById('lightbox-close').onclick = fecharLightbox;
    document.getElementById('lightbox-prev').onclick  = () => navLightbox(-1);
    document.getElementById('lightbox-next').onclick  = () => navLightbox(1);
    lightbox.addEventListener('click', e => { if (e.target === lightbox) fecharLightbox(); });

    document.addEventListener('keydown', e => {
      if (!lightbox.classList.contains('open')) return;
      if (e.key === 'Escape')      fecharLightbox();
      if (e.key === 'ArrowLeft')   navLightbox(-1);
      if (e.key === 'ArrowRight')  navLightbox(1);
    });
  </script>
</body>
</html>
